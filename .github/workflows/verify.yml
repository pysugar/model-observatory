name: Verify static report

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Read real tags on the exact build commit for the public footer.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned tooling
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chrome
          npm ci
      - name: Test release gates and build once
        run: |
          python -m unittest discover -s tests -v
          python scripts/publish.py build --require-clean
          python scripts/publish.py check --expected-commit "$GITHUB_SHA"
          npm run check:wrangler
          node node_modules/wrangler/bin/wrangler.js deploy --config wrangler.preview.json --dry-run --outdir test-results/wrangler-preview
      - name: Smoke-test the release
        # Ubuntu's AppArmor policy supports the system Chrome installation.
        run: python scripts/smoke.py --wrangler --browser-channel chrome
      - name: Keep the tested release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
